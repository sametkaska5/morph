name: CI

on:
  push:
    branches: [main]
  pull_request:

# Aynı dal için üst üste push yapılınca eski çalışmayı iptal et — sonuncusu
# zaten hepsini kapsıyor, boşuna dakika harcamasın.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Geliştirme ortamıyla aynı sürüm — "bende çalışıyordu" farkı olmasın.
          node-version: 24
          cache: npm

      # npm ci: package-lock.json'ı birebir kurar (npm install gibi lockfile'ı
      # güncellemez), böylece CI'daki bağımlılıklar yereldekiyle aynı olur.
      # Repodaki .npmrc otomatik okunur (legacy-peer-deps + ignore-scripts).
      - name: Bağımlılıkları kur
        run: npm ci

      # Üç adım da HER durumda çalışsın: lint patlayınca typecheck ve testleri
      # görememek, aynı hatayı üç turda düzeltmek demek. !cancelled() sayesinde
      # önceki adım başarısız olsa bile devam eder ama iş yine kırmızı biter.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Testler
        if: ${{ !cancelled() }}
        run: npm test -- --ci

  # Ayrı bir iş: quality ile paralel koşsun. Jest testleri saniyeler sürerken
  # bu iş konteyner indirip veritabanı ayağa kaldırıyor, ikisini aynı işe
  # koymak hızlı geri bildirimi yavaşın arkasında bekletirdi.
  rls:
    name: RLS politikaları
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Sürüm sabit, "latest" değil: CLI hangi Postgres imajını çekeceğine
          # kendi sürümüne göre karar veriyor. latest dersek bir gün habersiz
          # değişen bir veritabanına karşı test etmiş oluruz — testin anlamı
          # tam olarak "canlıdakiyle aynı veritabanı" varsayımına dayanıyor.
          version: 2.113.0

      # Testler yalnızca veritabanına dokunuyor. auth ve storage ŞEMALARI
      # Postgres imajının içinden geliyor, o servislerin konteynerlerine gerek
      # yok — kalan 12 servisi dışlamak indirme ve bekleme süresini kısaltıyor.
      # Bu liste yerelde birebir doğrulandı (101/101 geçti).
      - name: Veritabanını başlat
        run: >
          supabase start
          -x gotrue,realtime,storage-api,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # supabase start, migration'ları BOŞ bir veritabanına sıfırdan uyguluyor.
      # Yani bu adım aynı zamanda "migration'lar temiz kurulumda çalışıyor mu"
      # kontrolü — 0014'te düzelttiğimiz eksik yetkiler tam olarak bu yolla
      # ortaya çıkmıştı ve yalnızca burada yakalanabilirdi.
      - name: RLS testleri
        if: ${{ !cancelled() }}
        run: supabase test db

      # lib/database.types.ts şemayla aynı hizada mı? Dosyayı ayağa kalkmış
      # veritabanından yeniden üretip commit'lenmiş hâliyle karşılaştırıyoruz.
      # Fark çıkarsa biri şemayı değiştirip `npm run gen:types` çalıştırmayı
      # unutmuş demektir. Bunu yakalamak önemli çünkü bayat bir tip dosyası
      # derleme hatalarını YANLIŞ YERDEN çıkarır: hata migration'ı yazan
      # satırda değil, o tabloyu kullanan ekranda görünür.
      #
      # setup-node yok: script yalnızca node'un yerleşik modüllerini kullanıyor,
      # runner'ın hazır node'u yetiyor ve bu işe npm ci eklemek gereksiz.
      - name: Tipler guncel mi
        if: ${{ !cancelled() }}
        run: |
          node scripts/gen-types.mjs --local
          git diff --exit-code lib/database.types.ts
